    <rect x="12" y="12" width="8" height="8" rx="1.5"/>
    <rect x="22" y="12" width="8" height="8" rx="1.5"/>
  </g>
  <g fill="#f0a060">
    <rect x="2" y="22" width="8" height="8" rx="1.5"/>
